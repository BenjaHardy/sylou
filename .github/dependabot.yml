# Keeps the GitHub Actions in .github/workflows current: Dependabot moves
# each SHA pin and the version comment beside it. npm security updates are
# set in the repository settings and are not affected by this file.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]

  # The base images of Sylou Local's three Dockerfiles, by tag and digest, in
  # one pull request a month; package.yml must be green on it. Supabase's
  # images are left out here and in compose.yaml: they move together, one
  # tested snapshot at a time, by hand (D20). A new major of Node or Deno is
  # a change to make on purpose, not a monthly bump.
  - package-ecosystem: "docker"
    directories:
      - "/sylou-local/web"
      - "/sylou-local/functions"
      - "/sylou-local/tools"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "supabase/*"
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "denoland/deno"
        update-types: ["version-update:semver-major"]
    groups:
      sylou-local-images:
        patterns: ["*"]
