name: CI

# Runs on every pull request and on pushes to main. PRs get fast feedback
# before review; pushes to main keep the historical "main is green" signal
# and catch anything that landed directly.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Actions are pinned to commit SHAs, since a tag can be moved to other code;
# .github/dependabot.yml keeps the pins and their version comments current.
jobs:
  frontend:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      # `npm ci` reads package-lock.json exactly and fails if it is out of sync
      # with package.json, so the checks run against the same dependency tree
      # contributors have.
      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc, strict)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      # Attribution stays in sync with the dependency tree: any PR that
      # changes package-lock.json must regenerate THIRD_PARTY_LICENSES.md
      # (npm run licenses:generate) or this fails. The check only compares;
      # it never writes.
      - name: Third-party licenses up to date
        run: node scripts/generate-third-party-licenses.mjs --check

      # Vercel only builds on push to main (post-merge), so without this step
      # a PR that breaks the production build (asset imports, CSS, Rolldown
      # issues tsc can't see) would merge green and then fail the deploy.
      - name: Build (vite)
        run: npm run build

  edge-functions:
    name: Edge functions typecheck (deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # Cache Deno's module store so a registry blip (e.g. the esm.sh 522
      # that failed a green build) can't redden CI, and repeat runs skip the
      # cold download of every remote import. Keyed on the functions' source
      # (imports live inline); restore-keys serve a stale-but-useful cache
      # when imports change — deno revalidates and fetches only what's new.
      - name: Cache Deno dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/**/*.ts', 'supabase/functions/deno.json') }}
          restore-keys: |
            deno-${{ runner.os }}-

      # Mirrors the local `deno task check` (config: supabase/functions/deno.json;
      # nodeModulesDir=auto resolves the one npm: import for the typecheck).
      - name: deno check
        run: deno task check
        working-directory: supabase/functions

      # Unit tests for the shared modules (e.g. _shared/_llm.test.ts —
      # provider body translation and schema sanitizing). Test files live
      # next to the code they cover.
      - name: deno test
        run: deno task test
        working-directory: supabase/functions
