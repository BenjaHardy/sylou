name: Tests

# Run on every pull request and on pushes to main. PRs give contributors
# fast feedback before review; pushes to main catch anything that landed
# directly (and provide the historical signal that main is green).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # `npm ci` is the CI-appropriate install: it reads package-lock.json
        # exactly, fails if the lockfile is out of sync with package.json,
        # and skips writing the lockfile back. This is what guarantees the
        # tests run against the same dependency tree contributors have.
        run: npm ci

      - name: Run tests
        run: npm test
