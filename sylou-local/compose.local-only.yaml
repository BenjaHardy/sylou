# Local-only mode: this computer and nothing else.
#
# Used beside the main file, it takes the functions' way out away and starts
# the relay in its place:
#   docker compose -f compose.yaml -f compose.local-only.yaml \
#     --profile local-only --env-file config/settings.env up -d
#
# With this in force, no service that holds or reads your writing has a route
# off the computer. The functions keep exactly one destination — Ollama here,
# through the relay — and the edge functions themselves refuse every cloud
# provider, because SYLOU_LOCAL_ONLY is set (#247).
#
# The letter box still has the network its published port needs, and still
# reads nothing.
#
# `!override` matters below: Compose adds a list in a second file to the one
# in the first, so a plain list here would keep everything compose.yaml gives
# the functions. tests/recipe.test.ts resolves the two files together.

services:
  functions:
    environment:
      SYLOU_LOCAL_ONLY: "true"
      # The relay's name on the internal network.
      OLLAMA_URL: http://ollama.internal:11434
    # `egress` is gone: backend has no route to the internet at all.
    networks: !override [backend]
    # Only the two keys a function needs to reach its own database. The AI
    # providers' and web search's keys are never mounted while this mode is
    # on, so nothing in the container could use them.
    secrets: !override [supabase_anon_key, supabase_service_role_key]
