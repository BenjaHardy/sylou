# The letter box (D25). The one container with a published port, and the one
# that reads nothing: nginx in stream mode copies bytes between your browser
# and the front door. It parses no HTTP, serves no file, holds no part of the
# app, and leaves the site name in the request untouched, so the door's own
# name check still decides who gets an answer.
#
# It is mounted into the stock nginx/nginx-unprivileged image, not into one of
# ours, so there is nothing of Sylou's on the network that has a way out.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

stream {
    log_format letterbox '$remote_addr -> $upstream_addr $status '
                         '$bytes_sent/$bytes_received $session_time';
    access_log /dev/stdout letterbox;

    server {
        listen 8080;

        # The door is the only place these bytes can go.
        proxy_pass web:8080;

        proxy_connect_timeout 5s;
        # Longer than anything the door or the gateway will wait for, so a
        # slow answer from a model on this computer is never cut here. The
        # ladder: worker 600 s < gateway 620 s < door 620 s < this.
        proxy_timeout 660s;
    }
}
