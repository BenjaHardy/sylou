# The relay, used only in local-only mode (compose.local-only.yaml).
#
# In that mode the functions lose their way out to the internet, and this is
# the single route they keep: a fixed TCP forward to Ollama on this computer,
# reachable on the internal network as ollama.internal:11434. One destination,
# written here, with no way to ask for another.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

stream {
    log_format relay '$remote_addr -> $upstream_addr $status '
                     '$bytes_sent/$bytes_received $session_time';
    access_log /dev/stdout relay;

    server {
        listen 11434;
        proxy_pass host.docker.internal:11434;
        proxy_connect_timeout 5s;
        # A model on this computer can read a long prompt for minutes before
        # its first word; the functions wait 300 s for it.
        proxy_timeout 660s;
    }
}
