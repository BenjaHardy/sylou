# The headers on every answer the front door forwards from the data API,
# storage and the functions: the content policy Supabase's own self-hosting
# gateways put on those three (supabase/supabase#53466), and nosniff.
#
# The app and its API share one address here, so a browser that opens one of
# these answers as a page shows it, but under this policy it runs no script,
# submits no form and loads nothing else (media-src keeps audio and video
# playable, style-src an SVG's own styles). The app only fetches them, and a
# browser applies such a policy only to what it opens as a page. nosniff
# holds the browser to the declared type, so no page runs one as a script;
# Sylou loads no script from them.
#
# Included by each block that forwards one of the three, so the sign-in
# service's answers are left as Supabase leaves them. Pinned by
# src/lib/__tests__/security-headers.test.ts.

add_header Content-Security-Policy "default-src 'none'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
add_header X-Content-Type-Options "nosniff" always;
