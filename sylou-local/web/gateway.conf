# The gateway of a Sylou Local install: four routes from the front door to the
# four Supabase services, with the prefixes stripped as Supabase's own
# gateways do. It is inside Docker only, on the internal network, and
# publishes no port.
#
# This replaces Supabase's Envoy gateway (D1), which answers CORS for any
# origin, waits on Studio, and gives every non-function route 30 seconds.
# There is no admin, Studio, pg-meta, GraphQL or Realtime route here at all;
# the door in front of it refuses those paths too.
#
# It ships in the same image as the front door and is started with
# `nginx -c /etc/nginx/sylou/gateway.conf`, so the whole file is the config.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # The root filesystem is read-only; everything nginx writes goes to the
    # tmpfs mounted at /tmp.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Docker's own name service, re-asked every 10 s so a service that was
    # recreated is found again without restarting this container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # What comes after /<service>/v1, taken from the raw request line so that
    # encoded characters in a file name reach storage exactly as sent.
    map $request_uri $sylou_tail {
        "~^/(?:auth|rest|storage|functions)/v1(?<tail>/.*)$" $tail;
        default "/";
    }

    log_format sylou '$remote_addr "$request_method $uri" $status $body_bytes_sent '
                     'rt=$request_time urt=$upstream_response_time';

    server {
        listen 8000;
        server_name _;
        access_log /dev/stdout sylou;

        # The storage service's own limit is 10 MB; this leaves room for the
        # envelope around it, as the door does.
        client_max_body_size 11m;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $http_host;

        # The page and the API share one address, so no cross-site answer is
        # ever needed. Whatever a service sends is dropped here, as the door
        # drops it again on the way out.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Access-Control-Allow-Private-Network;

        # Sign-in. The admin API under /auth/v1/admin is refused by the door;
        # the tools container reaches it on the internal network instead.
        location /auth/v1/ {
            set $upstream auth:9999;
            proxy_pass http://$upstream$sylou_tail;
        }

        # The data API.
        location /rest/v1/ {
            set $upstream rest:3000;
            proxy_pass http://$upstream$sylou_tail;
        }

        # File storage. Only the object path gets this far: the door refuses
        # the S3 and image-rendering paths, and the service has them off.
        location /storage/v1/ {
            set $upstream storage:5000;
            proxy_request_buffering off;
            proxy_pass http://$upstream$sylou_tail;
        }

        # The eight functions by name. A folder added to the repository is not
        # reachable until it is listed here and in the door.
        location ~ ^/functions/v1/(?:analysis|chat|config|context-prompt|delete-account|editor-action|extract-text|share-report)(?:/|$) {
            set $upstream functions:9000;
            # Answers are streamed token by token; nothing is held back.
            proxy_buffering off;
            proxy_request_buffering off;
            # Longer than the worker's own 600 s, so a slow answer from a
            # model on this computer is ended by the worker, never here.
            proxy_read_timeout 620s;
            proxy_send_timeout 620s;
            proxy_pass http://$upstream$sylou_tail;
        }

        location / {
            return 404;
        }
    }
}
