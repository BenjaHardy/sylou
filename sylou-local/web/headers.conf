# The browser security headers of a Sylou Local install, the same set hosted
# Sylou sends (vercel.json, public/_headers) with one difference: everything
# this Sylou talks to is its own address, so connect-src is 'self' alone.
#
# Included by every block that serves a page or an asset. nginx drops the
# headers a block inherits as soon as that block adds one of its own, so each
# such block includes this file and re-adds anything else it needs.
# Pinned by src/lib/__tests__/security-headers.test.ts.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
