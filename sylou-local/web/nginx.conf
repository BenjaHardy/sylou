# The front door of a Sylou Local install: it serves the app's pages, sets
# the browser security headers, answers only to this computer's own names,
# and forwards four API paths to the gateway inside Docker. It publishes no
# port of its own and sits on the internal network, with no way out — the
# entry container holds the port and only copies bytes.
#
# This file replaces /etc/nginx/nginx.conf in the nginx/nginx-unprivileged
# image: the main-context settings below (a modest worker count, writable
# paths under the tmpfs) need the whole file, not a fragment.

worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    absolute_redirect off;

    # The root filesystem is read-only; everything nginx writes goes to the
    # tmpfs mounted at /tmp.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's own name service, re-read every 10 s so this container starts
    # whether or not the gateway is up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    log_format sylou '$remote_addr host=$http_host "$request_method $uri" $status $body_bytes_sent '
                     'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout sylou;

    # Any other Host — a name someone pointed at this computer, a typo, no
    # Host at all — gets the connection closed without a page or a status.
    server {
        listen 8080 default_server;
        server_name _;
        return 444;
    }

    # The port in the address the browser asked for: the one this install is
    # published on, which the container itself does not know.
    map $http_host $sylou_port {
        ~:([0-9]+)$ $1;
        default 80;
    }

    # One address for the app. 127.0.0.1 is sent on to localhost — the name
    # the sign-in links and the functions' allowed origin are made for — at
    # the port the browser used, so a page opened either way ends up with one
    # origin: one sign-in, one session. 308 keeps the method and the body.
    server {
        listen 8080;
        server_name 127.0.0.1;
        return 308 http://localhost:$sylou_port$request_uri;
    }

    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        client_max_body_size 11m;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $http_host;

        # Nothing behind this door answers a cross-site request: the page and
        # the API share one address, so every CORS header is dropped on the
        # way out rather than left for a browser to act on.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Access-Control-Allow-Private-Network;

        # ── The app ──────────────────────────────────────────────────────

        # A single-page app: a path it owns is answered with index.html.
        location / {
            include /etc/nginx/sylou/headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html;
        }

        location /assets/ {
            include /etc/nginx/sylou/headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # A shared FLOW report, kept out of search engines and sending no
        # referrer. index.html is served inside this block on purpose:
        # try_files would redirect the request internally to "location /",
        # whose headers then replace these two, which is how a report page
        # silently lost them (measured 2026-11; the live header test on
        # /report/x is what catches it).
        location /report/ {
            include /etc/nginx/sylou/headers.conf;
            add_header X-Robots-Tag "noindex" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Cache-Control "no-cache" always;
            rewrite ^ /index.html break;
        }

        # This install's address and key, written at start-up from the key
        # file the container is given (docker-entrypoint.d/40-sylou-runtime.sh).
        location = /sylou-runtime.js {
            include /etc/nginx/sylou/headers.conf;
            add_header Cache-Control "no-store" always;
            types { }
            default_type application/javascript;
            alias /tmp/sylou-runtime.js;
        }

        # ── Never forwarded ──────────────────────────────────────────────
        # The sign-in service's admin API (it mints links and changes any
        # account), storage's S3 and other non-object paths, a function this
        # Sylou does not have, and the pages of services this package does
        # not install. Each answers 404 rather than reaching the gateway.
        location ^~ /auth/v1/admin { return 404; }
        location ^~ /storage/v1/ { return 404; }
        location /functions/v1/ { return 404; }
        location ~ ^/(?:pg|studio|realtime|analytics|graphql)(?:/|$) { return 404; }

        # ── The four API paths ───────────────────────────────────────────
        # Forwarded to the gateway unchanged. /auth and /auth/set-password
        # are app pages and stay with "location /" above. The answers of the
        # data API, storage and the functions carry api-headers.conf; the
        # sign-in service's are left as Supabase leaves them.

        location /auth/v1/ {
            set $gateway gateway:8000;
            proxy_pass http://$gateway;
        }

        location /rest/v1/ {
            include /etc/nginx/sylou/api-headers.conf;
            set $gateway gateway:8000;
            proxy_pass http://$gateway;
        }

        location ^~ /storage/v1/object/ {
            include /etc/nginx/sylou/api-headers.conf;
            set $gateway gateway:8000;
            proxy_request_buffering off;
            proxy_pass http://$gateway;
        }

        # The eight functions, by name. Their answers are streams: nothing is
        # buffered, and the limits sit above the worker's own 600 s wall clock
        # so that limit is what ends a long answer, never this door.
        location ~ ^/functions/v1/(?:analysis|chat|config|context-prompt|delete-account|editor-action|extract-text|share-report)(?:/|$) {
            include /etc/nginx/sylou/api-headers.conf;
            set $gateway gateway:8000;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 620s;
            proxy_send_timeout 620s;
            proxy_pass http://$gateway;
        }
    }
}
